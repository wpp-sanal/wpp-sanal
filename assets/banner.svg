<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Hi, I'm Sanal — an old-school IT guy">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2420"/>
      <stop offset="1" stop-color="#0d120f"/>
    </linearGradient>
    <radialGradient id="screen" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0f2018"/>
      <stop offset="0.7" stop-color="#08130d"/>
      <stop offset="1" stop-color="#030705"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff8a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff8a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#39ff8a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><rect x="34" y="34" width="932" height="352" rx="26"/></clipPath>

    <clipPath id="c1"><rect x="60" y="62" height="26" width="0"><animate attributeName="width" from="0" to="560" begin="0.4s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="92" height="26" width="0"><animate attributeName="width" from="0" to="560" begin="1.2s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="60" y="122" height="26" width="0"><animate attributeName="width" from="0" to="560" begin="2.0s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="60" y="152" height="26" width="0"><animate attributeName="width" from="0" to="560" begin="2.8s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="cTitle"><rect x="56" y="195" height="80" width="0"><animate attributeName="width" from="0" to="900" begin="3.8s" dur="1.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- monitor -->
  <rect x="6" y="6" width="988" height="408" rx="38" fill="url(#bezel)" stroke="#2c3a32" stroke-width="2"/>
  <rect x="34" y="34" width="932" height="352" rx="26" fill="url(#screen)"/>

  <g clip-path="url(#screenClip)" font-family="'Courier New', Courier, 'DejaVu Sans Mono', monospace">
    <!-- header strip -->
    <text x="60" y="54" font-size="12" fill="#2f8f5b" letter-spacing="2">● PWR</text>
    <text x="940" y="54" font-size="12" fill="#2f8f5b" text-anchor="end" letter-spacing="2">TTY1 · 80×24 · SANAL-OS</text>

    <!-- boot log -->
    <g font-size="17" fill="#5cf59a" filter="url(#glow)">
      <text x="60" y="82" clip-path="url(#c1)">&gt; POST check .......................</text>
      <text x="60" y="112" clip-path="url(#c2)">&gt; loading firewall rules ...........</text>
      <text x="60" y="142" clip-path="url(#c3)">&gt; BGP sessions established .........</text>
      <text x="60" y="172" clip-path="url(#c4)">&gt; DDoS scrubbing: armed ............</text>
    </g>
    <g font-size="17" fill="#c8ffd9" filter="url(#glow)" font-weight="bold">
      <text x="440" y="82" opacity="0">[ OK ]<set attributeName="opacity" to="1" begin="1.1s" fill="freeze"/></text>
      <text x="440" y="112" opacity="0">[ OK ]<set attributeName="opacity" to="1" begin="1.9s" fill="freeze"/></text>
      <text x="440" y="142" opacity="0">[ OK ]<set attributeName="opacity" to="1" begin="2.7s" fill="freeze"/></text>
      <text x="440" y="172" opacity="0">[ OK ]<set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/></text>
    </g>

    <!-- title -->
    <text x="58" y="258" font-size="62" font-weight="bold" fill="#8dffb8" filter="url(#bigglow)" clip-path="url(#cTitle)" letter-spacing="1">Hi, I'm Sanal_</text>

    <!-- subtitle -->
    <text x="62" y="300" font-size="20" fill="#3fbf77" opacity="0" letter-spacing="1">Security · DDoS · Cloud · Datacenter · ISP · Linux<animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.8s" fill="freeze"/></text>

    <!-- prompt -->
    <g opacity="0" font-size="18">
      <set attributeName="opacity" to="1" begin="5.6s" fill="freeze"/>
      <text x="62" y="352" fill="#5cf59a" filter="url(#glow)">sanal@bangalore:~$</text>
      <rect x="264" y="337" width="11" height="19" fill="#8dffb8">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- uptime meter, right side -->
    <g opacity="0" font-size="13" fill="#2f8f5b">
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.6s" fill="freeze"/>
      <text x="700" y="82">DDoS   shield</text>
      <rect x="812" y="71" width="118" height="12" fill="none" stroke="#2f8f5b"/>
      <rect x="814" y="73" width="114" height="8" fill="#5cf59a"/>
      <text x="700" y="112">BGP    peers</text>
      <rect x="812" y="101" width="118" height="12" fill="none" stroke="#2f8f5b"/>
      <rect x="814" y="103" width="108" height="8" fill="#5cf59a"><animate attributeName="width" values="108;114;104;114;108" dur="4s" repeatCount="indefinite"/></rect>
      <text x="700" y="142">PPS    scrubbed</text>
      <rect x="812" y="131" width="118" height="12" fill="none" stroke="#2f8f5b"/>
      <rect x="814" y="133" width="60" height="8" fill="#5cf59a"><animate attributeName="width" values="12;20;114;40;14;90;18;12" dur="3.2s" repeatCount="indefinite"/></rect>
      <text x="700" y="172">UPTIME ∞ and counting</text>
    </g>

    <!-- CRT effects -->
    <rect x="34" y="34" width="932" height="352" fill="url(#scan)"/>
    <rect x="34" y="-60" width="932" height="90" fill="url(#sweep)">
      <animate attributeName="y" from="-60" to="400" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="34" width="932" height="352" fill="#5cf59a" opacity="0">
      <animate attributeName="opacity" values="0;0;0.035;0;0;0.02;0" keyTimes="0;0.6;0.62;0.64;0.9;0.92;1" dur="4.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- glass reflection -->
  <path d="M60 40 Q 500 20 940 40 L 940 90 Q 500 64 60 90 Z" fill="#ffffff" opacity="0.025"/>
</svg>
